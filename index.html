<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page-specific values are filled in by the landing-pages plugin in vite.config.ts -->
    <title>__PAGE_TITLE__</title>
    <meta name="description" content="__PAGE_DESCRIPTION__">
    <meta name="author" content="Compressly">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="__PAGE_URL__">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="__PAGE_TITLE__">
    <meta property="og:description" content="__PAGE_DESCRIPTION__">
    <meta property="og:site_name" content="Compressly">
    <meta property="og:url" content="__PAGE_URL__">
    <meta property="og:image" content="__SITE_URL__/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="__PAGE_TITLE__">
    <meta name="twitter:description" content="__PAGE_DESCRIPTION__">
    <meta name="twitter:image" content="__SITE_URL__/og-image.png">

    <!-- App / Product -->
    <meta name="application-name" content="Compressly">
    <meta name="apple-mobile-web-app-title" content="Compressly">
    <meta name="theme-color" content="#fefae0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- Apply the saved theme before first paint to avoid a light flash in dark mode. -->
    <script>
      (function () {
        var pref = "system";
        try { pref = JSON.parse(localStorage.getItem("compressly:theme")) || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1a1e10");
      })();
    </script>
  </head>
  <body>
    <!-- Static content for search engines and no-JS visitors; React replaces it. -->
    <div id="root">__PAGE_CONTENT__</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

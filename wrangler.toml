name = "compressly"
main = "worker/index.ts"
compatibility_date = "2026-03-08"

# Serve the Vite build as static assets; _headers in dist applies to them.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# API routes must hit the Worker instead of the SPA fallback.
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "COMPRESSLY_STATS"
id = "add246b862564e07a8dcc43de5b38c78"
